# Współdzielony release dla apek. Wywoływany z repo apki (app-template/.github/workflows/release.yml).
#   push na main  -> build :sha-<commit> i :stage
#   tag v*        -> ten sam obraz dostaje :prod i :vX.Y.Z (po zatwierdzeniu w Environment "production")
#   ręcznie z sha -> rollback prod na wskazany commit
name: app-release
on:
  workflow_call:
    inputs:
      sha:
        type: string
        default: ""

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  stage:
    if: github.ref == 'refs/heads/main' && inputs.sha == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:stage

  prod:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.sha != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Promote tested image to prod (bez przebudowy)
        env:
          SHA: ${{ inputs.sha != '' && inputs.sha || github.sha }}
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          tags="-t $IMAGE:prod"
          [ -n "$VERSION" ] && tags="$tags -t $IMAGE:$VERSION"
          docker buildx imagetools create $tags "$IMAGE:sha-$SHA"
