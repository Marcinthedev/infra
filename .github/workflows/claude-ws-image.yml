name: claude-ws image
on:
  push:
    branches: [main]
    paths: ["claude-ws/**"]
  schedule:
    - cron: "0 4 * * 1"   # co tydzień świeży obraz (aktualizacje systemu i Claude Code)
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: claude-ws
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/claude-ws:latest
